name: CI

# Affected-tests CI (see docs/PROCESS.md, "CI: affected tests"):
#   - pull_request / push: related unit tests (vitest --changed) + build + check:ac, and only the
#     e2e specs mapped from the changed files (scripts/affected-e2e.mjs). Never the full e2e suite.
#   - safe defaults: an unusable diff base runs the full unit suite (scripts/unit-tests-mode.mjs) and the
#     smoke e2e set, each with a ::warning::; an unmapped changed path also selects the smoke set.
#   - push to main: deploy follows build + related unit tests; e2e runs in a separate job that
#     deploy does not wait for.
#   - workflow_dispatch (manual): the full suite (all unit tests, all e2e, build, check:ac). No deploy.

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve diff base
        id: base
        if: github.event_name != 'workflow_dispatch'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          # No guessing: an empty, all-zeros (new branch) or unfetchable (force-push) base is passed on
          # as-is, and the unit and e2e steps below fall back to the full unit suite / smoke e2e.
          BASE="${PR_BASE_SHA:-$PUSH_BEFORE_SHA}"
          echo "Diff base: ${BASE:-<none>}"
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"

      - name: Unit tests (full suite, manual run)
        if: github.event_name == 'workflow_dispatch'
        run: npm test

      - name: Unit tests (related to the change only)
        if: github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          # `full` when the base is empty, all zeros or not a fetchable commit (warning printed by the
          # script); never a vacuous pass. Otherwise `changed`.
          MODE="$(node scripts/unit-tests-mode.mjs "$BASE_SHA")"
          if [ "$MODE" = "full" ]; then
            npm test
            exit 0
          fi
          echo "Changed files vs $BASE_SHA:"
          git diff --name-only "$BASE_SHA...HEAD" || true
          # Zero related tests is fine (docs/config-only changes).
          npx vitest run --changed "$BASE_SHA" --passWithNoTests
          # The e2e map safety net must also run on a PR that only adds a spec (no import-graph link).
          npx vitest run tests/unit/affectedE2e.test.ts

      - name: Acceptance-criteria coverage (docs/specs vs test titles)
        run: npm run check:ac

      - name: Build
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  # Separate from test-and-build so a push to main deploys without waiting for (or being blocked by) e2e.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select e2e specs
        id: select
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run: full e2e suite."
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "specs=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${PR_BASE_SHA:-$PUSH_BEFORE_SHA}"
          # The script handles an empty/all-zeros base or a failing `git diff` itself: it selects the
          # smoke set with a ::warning:: and writes run=true. Never run=false for those cases.
          node scripts/affected-e2e.mjs --base "$BASE" --head HEAD --github-output

      - name: Read Playwright version
        id: pw
        if: steps.select.outputs.run == 'true'
        run: echo "version=$(node -p "JSON.parse(require('fs').readFileSync('node_modules/@playwright/test/package.json','utf8')).version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        if: steps.select.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers and OS deps
        if: steps.select.outputs.run == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (browsers restored from cache)
        if: steps.select.outputs.run == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: End-to-end tests (full suite, manual run)
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:e2e

      - name: End-to-end tests (affected specs only; builds + previews internally)
        if: github.event_name != 'workflow_dispatch' && steps.select.outputs.run == 'true'
        env:
          E2E_SPECS: ${{ steps.select.outputs.specs }}
        run: |
          echo "Running specs: $E2E_SPECS"
          # shellcheck disable=SC2086
          npx playwright test $E2E_SPECS

      - name: Upload Playwright report
        if: always() && steps.select.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always() && steps.select.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/
          retention-days: 14
          if-no-files-found: ignore

  # Prepared for later: publishes dist/ to GitHub Pages after a push to main.
  # The owner (Maor) must first switch the repository's Pages source from
  # "Deploy from a branch" to "GitHub Actions" in repo Settings > Pages.
  # Until that switch happens, this job's deployment has no effect and the
  # live site at https://tzoomy.github.io/kids-app/ keeps serving the root
  # prototype (index.html/app.js/style.css) from the main branch.
  # Depends on build + related unit tests only; e2e never blocks deploy.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  <ellipse cx="27" cy="29" rx="20" ry="21.5" fill="#FFFDF9" stroke="#3B2A22" stroke-width="4.5"/>
  <!-- Big round dark pupil -->
  <ellipse cx="27" cy="29" rx="15.5" ry="17" fill="#261710"/>
  <!-- Warm brown lower iris crescent -->
  <path d="M 14 33 C 17 43, 37 43, 40 33 C 35 39, 19 39, 14 33 Z" fill="#6E422C"/>

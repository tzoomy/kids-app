  <path d="M 43 142 C 50 174, 78 186, 110 186 C 142 186, 170 174, 177 142 C 162 168, 138 174, 110 174 C 82 174, 58 168, 43 142 Z" fill="#CC3333"/>

  <!-- Upper left torso highlight -->
  <path d="M 62 58 C 52 80, 50 108, 54 130 C 60 108, 64 82, 74 62 Z" fill="#EE6C62"/>

  <!-- Warm cream-yellow belly patch -->
  <ellipse cx="110" cy="116" rx="44" ry="48" fill="#FFF2A6"/>
  <path d="M 68 128 C 76 152, 92 164, 110 164 C 128 164, 144 152, 152 128 C 138 146, 124 154, 110 154 C 96 154, 82 146, 68 128 Z" fill="#FFE073"/>


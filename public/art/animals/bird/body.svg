<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="220" height="200">
  <!-- Neck tab tucked under head -->
  <path d="M 80 42 C 80 12, 140 12, 140 42 Z" fill="#CC3333" stroke="#3B2A22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Plump storybook bird torso -->
  <path d="M 68 34 C 42 58, 34 106, 42 146 C 50 176, 78 186, 110 186 C 142 186, 170 176, 178 146 C 186 106, 178 58, 152 34 C 136 20, 84 20, 68 34 Z" fill="#F24C4C"/>

  <!-- Under-neck and lower body shadow -->

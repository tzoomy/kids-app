<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 108" width="96" height="108">
  <!-- Pointed right cat ear with wide, deep tucked base -->
  <path d="M 74 104 C 78 74, 76 38, 70 10 C 68 5, 62 5, 56 12 C 38 32, 14 62, 8 102 Z" fill="#FFA647"/>
  <!-- Outer ear shadow -->
  <path d="M 74 104 C 78 76, 76 44, 70 16 C 70 44, 62 74, 48 98 Z" fill="#E58426"/>
  <!-- Outer ear highlight -->
  <path d="M 64 12 C 54 16, 40 30, 28 48 C 42 32, 54 20, 64 12 Z" fill="#FFC278"/>
  <!-- Sweet pink inner ear triangle tucked into the lower ~53% (y >= 54) -->
  <path d="M 60 90 C 64 78, 64 64, 58 56 C 55 53, 50 54, 44 60 C 36 68, 28 78, 26 88 Z" fill="#FF9EBB"/>
  <!-- Outline -->
  <path d="M 74 104 C 78 74, 76 38, 70 10 C 68 5, 62 5, 56 12 C 38 32, 14 62, 8 102 Z" fill="none" stroke="#3B2A22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Short horizontal outer-ear whiskers in visible upper ~47% -->
  <path d="M 74 24 L 91 19 M 76 34 L 92 33 M 77 44 L 91 47" fill="none" stroke="#3B2A22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

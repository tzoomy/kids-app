<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
  <!-- Soft cream neck fluff collar tucked under head -->
  <path d="M 62 38 C 62 14, 138 14, 138 38 C 128 48, 72 48, 62 38 Z" fill="#FFF6E8" stroke="#3B2A22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small rounded bottom tail bump (friendly, never sharp) -->
  <ellipse cx="100" cy="164" rx="14" ry="8" fill="#EAA814" stroke="#3B2A22" stroke-width="5.5"/>

  <!-- Plump golden bee torso -->
  <path d="M 60 34 C 36 56, 30 100, 42 138 C 52 160, 76 166, 100 166 C 124 166, 148 160, 158 138 C 170 100, 164 56, 140 34 C 124 22, 76 22, 60 34 Z" fill="#FFD43B"/>

  <!-- Lower torso shadow -->
  <path d="M 42 132 C 52 158, 76 166, 100 166 C 124 166, 148 158, 158 132 C 144 152, 122 156, 100 156 C 78 156, 56 152, 42 132 Z" fill="#EAA814"/>

  <!-- Upper left highlight -->
  <path d="M 52 54 C 44 74, 42 98, 46 118 C 52 98, 56 76, 64 58 Z" fill="#FFE073"/>

  <!-- Two warm dark curved bee stripes -->
  <path d="M 38 74 C 66 86, 134 86, 162 74 C 165 84, 165 94, 163 102 C 134 114, 66 114, 37 102 C 35 94, 35 84, 38 74 Z" fill="#3D3532"/>
  <path d="M 41 118 C 68 130, 132 130, 159 118 C 156 128, 152 136, 146 142 C 122 152, 78 152, 54 142 C 48 136, 44 128, 41 118 Z" fill="#3D3532"/>

  <!-- Torso outline -->
  <path d="M 60 34 C 36 56, 30 100, 42 138 C 52 160, 76 166, 100 166 C 124 166, 148 160, 158 138 C 170 100, 164 56, 140 34 C 124 22, 76 22, 60 34 Z" fill="none" stroke="#3B2A22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cute little side arms and tiny stubby feet at bottom -->
  <g>
    <!-- Left arm -->
    <path d="M 46 62 C 26 70, 16 90, 22 108 C 26 118, 40 116, 46 102" fill="#FFD43B" stroke="#3B2A22" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right arm -->
    <path d="M 154 62 C 174 70, 184 90, 178 108 C 174 118, 160 116, 154 102" fill="#FFD43B" stroke="#3B2A22" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Left tiny foot -->
    <ellipse cx="72" cy="164" rx="20" ry="11" fill="#3D3532" stroke="#3B2A22" stroke-width="5.5"/>
    <ellipse cx="70" cy="161" rx="9" ry="4" fill="#5C4338"/>

    <!-- Right tiny foot -->
    <ellipse cx="128" cy="164" rx="20" ry="11" fill="#3D3532" stroke="#3B2A22" stroke-width="5.5"/>
    <ellipse cx="130" cy="161" rx="9" ry="4" fill="#5C4338"/>
  </g>
</svg>

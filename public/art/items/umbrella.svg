      <path d="M128 26 C98 46 78 82 76 132" fill="none" stroke-width="5"/>
      <path d="M128 26 L128 132" fill="none" stroke-width="5"/>
      <path d="M128 26 C158 46 178 82 180 132" fill="none" stroke-width="5"/>

      <!-- Top cap collar -->
      <ellipse cx="128" cy="28" rx="14" ry="6" fill="#FFD166" stroke-width="5"/>
    </g>
  </g>

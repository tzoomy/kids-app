      <path d="M22 132 C22 66 68 26 128 26 C188 26 234 66 234 132 Q208 114 180 132 Q154 114 128 132 Q102 114 76 132 Q48 114 22 132 Z" fill="var(--item-fill, #F24C4C)"/>


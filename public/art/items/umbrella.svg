      <line x1="128" y1="120" x2="128" y2="196" stroke="#3B2A22" stroke-width="6"/>

      <!-- Classic J-curved brown wooden handle -->
      <path d="M120 186 L136 186 L136 212 C136 232 122 244 104 244 C86 244 74 232 74 214 C74 208 78 204 82 204 C86 204 90 208 90 214 C90 222 96 228 104 228 C112 228 120 222 120 212 Z" fill="#B87D56"/>
      <path d="M128 188 L134 188 L134 212 C134 230 120 241 104 241 L104 234 C118 234 128 224 128 212 Z" fill="#9E6540" stroke="none"/>
      <path d="M120 186 L136 186 L136 212 C136 232 122 244 104 244 C86 244 74 232 74 214 C74 208 78 204 82 204 C86 204 90 208 90 214 C90 222 96 228 104 228 C112 228 120 222 120 212 Z" fill="none"/>


      <path d="M72 152 C68 174 76 190 96 196 L166 216 C186 222 204 218 212 204 L100 172 L96 44 L84 44 Z" fill="var(--item-shadow, #2B6FD6)" stroke="none"/>
      <!-- Cream heel patch -->

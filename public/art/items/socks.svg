<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <g stroke="#3B2A22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- BACK SOCK (tilted slightly left) -->
    <g transform="translate(-26, -12) rotate(-8 128 128)">
      <!-- Main sock body -->
      <path d="M84 44 L144 44 L144 132 C144 142 152 148 168 154 L194 164 C212 170 220 188 212 204 C204 218 186 222 166 216 L96 196 C76 190 68 174 72 152 L84 44 Z" fill="var(--item-fill, #4D96FF)"/>

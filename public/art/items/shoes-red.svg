      <path d="M52 112 C52 98 66 94 84 96 L114 100 C124 102 132 112 140 128 C154 144 178 152 204 154 C222 156 234 168 234 186 L234 196 L46 196 L46 152 C46 134 50 120 52 112 Z" fill="var(--item-fill, #F24C4C)"/>
      <!-- Lower and heel shadow -->
      <path d="M46 168 C94 176 156 176 232 174 L234 196 L46 196 Z" fill="var(--item-shadow, #CC3333)" stroke="none"/>
      <!-- Upper ankle highlight -->
      <path d="M60 116 C66 106 86 106 102 112 C92 122 80 136 72 154 C60 148 56 130 60 116 Z" fill="var(--item-highlight, #FF8585)" stroke="none"/>
      <!-- Re-stroke front upper -->
      <path d="M52 112 C52 98 66 94 84 96 L114 100 C124 102 132 112 140 128 C154 144 178 152 204 154 C222 156 234 168 234 186 L234 196 L46 196 L46 152 C46 134 50 120 52 112 Z" fill="none"/>
      <!-- Cream rubber toe cap -->
      <path d="M188 153 C214 154 234 166 234 188 L234 196 L180 196 C178 178 180 162 188 153 Z" fill="#FFF6E8"/>
      <!-- Two chunky velcro straps -->
      <rect x="116" y="116" width="32" height="14" rx="7" transform="rotate(-18 116 116)" fill="#FFF6E8" stroke-width="5"/>
      <rect x="134" y="134" width="32" height="14" rx="7" transform="rotate(-18 134 134)" fill="#FFF6E8" stroke-width="5"/>
      <!-- Chunky cream rubber sole -->
      <rect x="42" y="188" width="196" height="26" rx="13" fill="#FFF6E8"/>
      <path d="M50 206 L230 206 C228 211 222 213 214 213 L66 213 C58 213 52 211 50 206 Z" fill="#F0DEC2" stroke="none"/>
      <rect x="42" y="188" width="196" height="26" rx="13" fill="none"/>
      <line x1="56" y1="201" x2="224" y2="201" stroke="#3B2A22" stroke-width="4"/>
    </g>

      <ellipse cx="70" cy="70" rx="26" ry="11" fill="#F0DEC2"/>
      <!-- Sneaker upper body -->
      <path d="M36 74 C36 62 48 56 64 58 L94 62 C102 64 108 72 114 86 C126 102 150 110 176 112 C194 114 206 126 206 142 L206 150 L30 150 L30 110 C30 94 34 82 36 74 Z" fill="var(--item-fill, #F24C4C)"/>

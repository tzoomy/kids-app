    <ellipse cx="150" cy="211" rx="12" ry="5" fill="#B87D56"/>
    <ellipse cx="156" cy="216" rx="28" ry="15" fill="none" stroke="#3B2A22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Short arms with bearCream hands -->

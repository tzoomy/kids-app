    <!-- Collar band -->
    <path d="M 70 42 C 86 64, 154 64, 170 42 C 160 30, 80 30, 70 42 Z" fill="#F4A261"/>
    <path d="M 74 46 C 90 64, 150 64, 166 46 C 152 56, 88 56, 74 46 Z" fill="#D4622A"/>

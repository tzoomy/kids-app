  <path d="M 138 64 C 142 108, 142 150, 138 192" fill="none" stroke="#5C4338" stroke-width="5" stroke-linecap="round"/>
  <circle cx="102" cy="102" r="6" fill="#5C4338"/>
  <circle cx="126" cy="102" r="6" fill="#5C4338"/>
  <circle cx="102" cy="138" r="6" fill="#5C4338"/>
  <circle cx="126" cy="138" r="6" fill="#5C4338"/>


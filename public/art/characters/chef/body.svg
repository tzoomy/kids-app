    <path d="M 198 136 C 202 146, 220 148, 226 136 C 218 142, 206 142, 198 136 Z" fill="#E5BF98"/>
    <circle cx="212" cy="132" r="16" fill="none" stroke="#3B2A22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>


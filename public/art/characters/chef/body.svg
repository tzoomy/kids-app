    <path d="M 176 56 C 204 64, 226 92, 224 120 C 214 128, 196 126, 186 114 C 178 100, 174 80, 176 56 Z" fill="#FFFDF9"/>
    <path d="M 224 110 C 216 122, 198 122, 186 114 C 196 126, 214 128, 224 120 Z" fill="#F0DEC2"/>

  <path d="M 74 40 C 50 64, 42 114, 48 160 C 52 184, 80 194, 120 194 C 160 194, 188 184, 192 160 C 198 114, 190 64, 166 40 C 150 28, 90 28, 74 40 Z" fill="#FFFDF9"/>


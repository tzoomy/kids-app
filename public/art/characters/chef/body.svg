    <path d="M 66 174 L 66 208 C 66 216, 108 216, 108 208 L 108 174 Z" fill="#3D3532"/>
    <path d="M 66 194 C 76 204, 98 204, 108 194 L 108 208 C 108 216, 66 216, 66 208 Z" fill="#282220"/>

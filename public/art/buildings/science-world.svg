  <!-- Potion bubbles -->
  <circle cx="178" cy="190" r="5" fill="#7BD389" stroke="#3B2A22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="189" cy="182" r="4.5" fill="#7BD389" stroke="#3B2A22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

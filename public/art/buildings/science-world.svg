<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 270" width="270" height="270">
  <!-- House body -->
  <rect x="58.5" y="135" width="153" height="99" rx="16" ry="16" fill="#FFF6E0" stroke="#3B2A22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Triangular roof -->
  <polygon points="44.5,139 135,41 225.5,139" fill="#6C8CFF" stroke="#3B2A22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Roof star sign -->
  <polygon points="135,76 140.3,88.7 154,89.8 143.6,98.8 146.8,112.2 135,105 123.2,112.2 126.4,98.8 116,89.8 129.7,88.7" fill="#FFD43B" stroke="#3B2A22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Front door -->
  <rect x="116.6" y="169.6" width="36.8" height="64.4" rx="6" ry="6" fill="#A0632E" stroke="#3B2A22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Porthole window -->
  <circle cx="86" cy="174" r="16" fill="#9AD8FF" stroke="#3B2A22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

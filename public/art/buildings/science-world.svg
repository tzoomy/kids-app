  <path d="M 177,158 L 189,158 L 189,178.9 A 20,20 0 1,1 177,178.9 Z" fill="#D8F3FF" stroke="#3B2A22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Flask green liquid -->

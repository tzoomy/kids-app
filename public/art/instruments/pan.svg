      <path d="M156 108 L178 126 L186 116 L164 98 Z" fill="#FFD166" stroke="#3B2A22" stroke-width="5"/>
      <path d="M158 110 L214 34 C222 24 242 36 234 50 L176 128 Z" fill="none" stroke="#3B2A22" stroke-width="6"/>
      <circle cx="218" cy="48" r="6" fill="#FFF6E8" stroke="#3B2A22" stroke-width="4"/>

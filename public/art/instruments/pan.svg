      <path d="M22 146 C22 204 60 232 108 232 C156 232 194 204 194 146 Z" fill="#3D3532"/>
      <path d="M96 231 C148 232 192 204 194 146 L170 156 C166 196 138 218 96 231 Z" fill="#282220"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480">
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Lighter oval tummy panel on front of shirt -->
    <ellipse cx="180" cy="312" rx="48" ry="54" fill="#FFF6E8" stroke="#3B2A22" stroke-width="5"/>
    <!-- Tummy highlight -->
    <path d="M 146 286 Q 158 266 184 266 Q 162 276 152 302 Q 146 296 146 286 Z" fill="#FFFDF9"/>
    <!-- Tummy lower shadow -->
    <path d="M 140 332 Q 180 364 220 332 Q 208 360 180 360 Q 152 360 140 332 Z" fill="#F0DEC2"/>
    <!-- Re-stroke tummy outline cleanly -->
    <ellipse cx="180" cy="312" rx="48" ry="54" fill="none" stroke="#3B2A22" stroke-width="5"/>
  </g>
</svg>

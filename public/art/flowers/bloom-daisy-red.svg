<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Ring of 8 rounded daisy petals -->
  <g stroke="#3B2A22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="128" cy="54" rx="28" ry="38" fill="var(--bloom-fill, #F24C4C)"/>
    <ellipse cx="128" cy="202" rx="28" ry="38" fill="var(--bloom-fill, #F24C4C)"/>
    <ellipse cx="54" cy="128" rx="38" ry="28" fill="var(--bloom-fill, #F24C4C)"/>
    <ellipse cx="202" cy="128" rx="38" ry="28" fill="var(--bloom-fill, #F24C4C)"/>
    <g transform="rotate(45 128 128)">
      <ellipse cx="128" cy="54" rx="28" ry="38" fill="var(--bloom-fill, #F24C4C)"/>
      <ellipse cx="128" cy="202" rx="28" ry="38" fill="var(--bloom-fill, #F24C4C)"/>
      <ellipse cx="54" cy="128" rx="38" ry="28" fill="var(--bloom-fill, #F24C4C)"/>
      <ellipse cx="202" cy="128" rx="38" ry="28" fill="var(--bloom-fill, #F24C4C)"/>
    </g>
  </g>

  <!-- Upper petal highlights & lower petal shadows -->
  <ellipse cx="128" cy="34" rx="14" ry="8" fill="var(--bloom-highlight, #FF8585)"/>
  <ellipse cx="64" cy="64" rx="13" ry="8" transform="rotate(-45 64 64)" fill="var(--bloom-highlight, #FF8585)"/>
  <ellipse cx="192" cy="64" rx="13" ry="8" transform="rotate(45 192 64)" fill="var(--bloom-highlight, #FF8585)"/>
  <ellipse cx="34" cy="128" rx="8" ry="13" fill="var(--bloom-highlight, #FF8585)"/>
  <ellipse cx="222" cy="128" rx="8" ry="13" fill="var(--bloom-shadow, #CC3333)"/>
  <ellipse cx="128" cy="222" rx="15" ry="9" fill="var(--bloom-shadow, #CC3333)"/>
  <ellipse cx="64" cy="192" rx="14" ry="8" transform="rotate(45 64 192)" fill="var(--bloom-shadow, #CC3333)"/>
  <ellipse cx="192" cy="192" rx="14" ry="8" transform="rotate(-45 192 192)" fill="var(--bloom-shadow, #CC3333)"/>

  <!-- Inner petal ring shadow around center disc -->
  <circle cx="128" cy="128" r="54" fill="var(--bloom-shadow, #CC3333)" opacity="0.45"/>

  <!-- Warm yellow/gold daisy center -->
  <circle cx="128" cy="128" r="44" fill="#FFD43B" stroke="#3B2A22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M90 136 C96 156 110 166 128 166 C146 166 160 156 166 136 C156 148 144 154 128 154 C112 154 100 148 90 136 Z" fill="#EAA814"/>
  <path d="M98 106 C106 94 120 88 136 92 C122 96 110 104 102 114 Z" fill="#FFF2A6"/>
  <circle cx="128" cy="128" r="44" fill="none" stroke="#3B2A22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

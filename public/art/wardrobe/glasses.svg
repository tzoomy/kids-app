    <path d="M 62 12 A 32 32 0 1 0 62 76 A 32 32 0 1 0 62 12 Z M 62 22 A 22 22 0 1 1 62 66 A 22 22 0 1 1 62 22 Z" fill="#E85D4A" fill-rule="evenodd"/>
    <!-- Left frame flat highlight -->

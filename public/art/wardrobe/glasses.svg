    <!-- Left frame flat shadow -->
    <path d="M 44 66 C 54 74 70 74 80 66" fill="none" stroke="#C04232" stroke-width="4"/>
    <!-- Re-stroke left frame -->
    <circle cx="62" cy="44" r="32" fill="none"/>
    <circle cx="62" cy="44" r="22" fill="none"/>
    <!-- Left lens white glint -->
    <path d="M 48 36 L 56 29" fill="none" stroke="#FFFDF9" stroke-width="5"/>

    <!-- Right round frame with transparent lens -->

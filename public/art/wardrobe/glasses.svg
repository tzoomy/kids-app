    <path d="M 32 36 L 10 34 C 6 34 6 44 10 44 L 32 46 Z" fill="#C04232"/>
    <path d="M 188 36 L 210 34 C 214 34 214 44 210 44 L 188 46 Z" fill="#C04232"/>

    <!-- Nose bridge -->
    <path d="M 90 38 C 100 30 120 30 130 38 L 130 48 C 120 42 100 42 90 48 Z" fill="#E85D4A"/>


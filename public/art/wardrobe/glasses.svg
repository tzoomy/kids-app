    <!-- Right frame flat shadow -->
    <path d="M 140 66 C 150 74 166 74 176 66" fill="none" stroke="#C04232" stroke-width="4"/>
    <!-- Re-stroke right frame -->
    <circle cx="158" cy="44" r="32" fill="none"/>
    <circle cx="158" cy="44" r="22" fill="none"/>
    <!-- Right lens white glint -->
    <path d="M 144 36 L 152 29" fill="none" stroke="#FFFDF9" stroke-width="5"/>
  </g>
</svg>

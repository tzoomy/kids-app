<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140">
  <g stroke="#3B2A22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pom-pom on top -->
    <circle cx="100" cy="24" r="16" fill="#FFF6E8"/>
    <path d="M 104 10 A 16 16 0 0 1 100 40 A 16 16 0 0 1 88 33 C 98 34 108 24 104 10 Z" fill="#F0DEC2" stroke="none"/>
    <circle cx="94" cy="18" r="4.5" fill="#FFFFFF" stroke="none"/>
    <circle cx="100" cy="24" r="16" fill="none"/>

    <!-- Knitted beanie dome -->
    <path d="M 28 98 C 28 46 60 32 100 32 C 140 32 172 46 172 98 Z" fill="#4A9FD8"/>
    <!-- Flat shadow on right side of dome -->
    <path d="M 118 35 C 148 41 172 58 172 98 L 136 98 C 140 70 134 48 118 35 Z" fill="#3580B5" stroke="none"/>
    <!-- Flat highlight on upper-left of dome -->
    <path d="M 44 78 C 48 54 68 42 90 40 C 74 48 60 62 56 84 C 48 84 44 82 44 78 Z" fill="#7EC0EE" stroke="none"/>
    <!-- Re-stroke dome -->
    <path d="M 28 98 C 28 46 60 32 100 32 C 140 32 172 46 172 98 Z" fill="none"/>

    <!-- Subtle knit lines on dome -->
    <path d="M 68 42 C 62 60 58 76 58 92" fill="none" stroke-width="4"/>
    <path d="M 100 36 L 100 92" fill="none" stroke-width="4"/>
    <path d="M 132 42 C 138 60 142 76 142 92" fill="none" stroke-width="4"/>

    <!-- Folded knitted cuff at the bottom -->
    <path d="M 18 100 C 18 90 30 88 100 88 C 170 88 182 90 182 100 L 182 122 C 182 132 146 134 100 134 C 54 134 18 132 18 122 Z" fill="#5DB0E6"/>
    <!-- Flat shadow on right and bottom of cuff -->
    <path d="M 140 90 C 170 90 182 92 182 100 L 182 122 C 182 132 146 134 100 134 L 100 124 C 136 124 148 116 140 90 Z" fill="#3580B5" stroke="none"/>
    <!-- Re-stroke cuff -->
    <path d="M 18 100 C 18 90 30 88 100 88 C 170 88 182 90 182 100 L 182 122 C 182 132 146 134 100 134 C 54 134 18 132 18 122 Z" fill="none"/>

    <!-- Knit rib lines on cuff -->
    <line x1="50" y1="98" x2="50" y2="124" stroke-width="4"/>
    <line x1="82" y1="96" x2="82" y2="126" stroke-width="4"/>
    <line x1="118" y1="96" x2="118" y2="126" stroke-width="4"/>
    <line x1="150" y1="98" x2="150" y2="124" stroke-width="4"/>
  </g>
</svg>

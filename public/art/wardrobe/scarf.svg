<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="240" height="140">
  <g stroke="#3B2A22" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Fringe at bottom of hanging end -->
    <line x1="152" y1="116" x2="152" y2="132"/>
    <line x1="166" y1="116" x2="166" y2="132"/>
    <line x1="180" y1="116" x2="180" y2="132"/>
    <line x1="194" y1="114" x2="194" y2="130"/>

    <!-- Hanging right end of scarf -->
    <path d="M 146 54 L 198 52 L 202 114 C 186 120 160 120 144 114 Z" fill="#E85D5A"/>
    <!-- Stripes on hanging end -->
    <path d="M 145 78 L 200 76 L 201 90 L 145 92 Z" fill="#FFF6E8" stroke="none"/>
    <path d="M 145 96 L 201 94 L 201 104 L 145 106 Z" fill="#FFD166" stroke="none"/>
    <!-- Shadow on right edge of hanging end -->
    <path d="M 184 53 L 198 52 L 202 114 C 194 117 186 118 180 118 Z" fill="#C4413E" stroke="none"/>
    <!-- Re-stroke hanging end -->
    <path d="M 146 54 L 198 52 L 202 114 C 186 120 160 120 144 114 Z" fill="none"/>

    <!-- Horizontal neck wrap band on top -->
    <path d="M 28 24 C 28 12 72 12 120 16 C 168 12 212 12 212 24 L 210 56 C 210 68 168 72 120 72 C 72 72 30 68 30 56 Z" fill="#E85D5A"/>
    <!-- Vertical stripes on neck band -->
    <path d="M 56 17 L 70 17 L 70 68 L 56 67 Z" fill="#FFF6E8" stroke="none"/>
    <path d="M 108 18 L 122 18 L 122 71 L 108 71 Z" fill="#FFD166" stroke="none"/>
    <path d="M 164 17 L 178 17 L 178 68 L 164 69 Z" fill="#FFF6E8" stroke="none"/>
    <!-- Flat shadow along lower curve of neck band -->
    <path d="M 32 48 C 60 62 180 62 208 48 L 210 56 C 210 68 168 72 120 72 C 72 72 30 68 30 56 Z" fill="#C4413E" stroke="none"/>
    <!-- Flat highlight along upper-left curve -->
    <path d="M 36 26 C 52 18 82 18 104 20 C 82 24 54 26 38 34 Z" fill="#FF8B88" stroke="none"/>
    <!-- Re-stroke neck band -->
    <path d="M 28 24 C 28 12 72 12 120 16 C 168 12 212 12 212 24 L 210 56 C 210 68 168 72 120 72 C 72 72 30 68 30 56 Z" fill="none"/>
  </g>
</svg>

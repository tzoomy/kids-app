    <!-- Interior bowl shadow under back rim -->
    <path d="M 82 140 C 90 112 130 98 180 98 C 230 98 270 112 278 140 C 258 122 222 114 180 114 C 138 114 102 122 82 140 Z" fill="#5C4338" stroke="none" />

    <path d="M 24 230 C 110 226 218 226 336 212 C 338 216 336 218 332 219 C 216 232 108 232 24 236 Z" fill="#5C4338" stroke="none" />

    <!-- Back leaves on branch -->
    <path d="M 56 196 C 26 184 16 154 34 136 C 56 134 78 160 66 194 Z" fill="#57C457" />
    <path d="M 38 144 C 50 144 62 158 62 178 C 52 162 44 152 38 144 Z" fill="#8AE07E" stroke="none" />

    <path d="M 294 182 C 314 156 342 152 348 172 C 344 194 318 204 294 188 Z" fill="#57C457" />
    <path d="M 304 178 C 318 164 334 162 340 172 C 328 172 314 174 304 178 Z" fill="#8AE07E" stroke="none" />

    <!-- Nest outer bowl base -->
    <path d="M 52 146 C 46 98 106 72 180 72 C 254 72 314 98 308 146 C 302 204 248 228 180 228 C 112 228 58 204 52 146 Z" fill="#B87D56" />

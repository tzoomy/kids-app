    <path d="M 48 358 C 52 344 64 344 66 358 Z" fill="#8AE07E" stroke="none" />

    <path d="M 234 372 C 224 354 236 344 250 356 C 250 338 268 336 274 354 C 288 340 302 352 292 372 Z" fill="#57C457" />
    <path d="M 254 358 C 256 344 268 344 272 358 Z" fill="#8AE07E" stroke="none" />

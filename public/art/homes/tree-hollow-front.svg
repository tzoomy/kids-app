    <!-- Bark shadow under ledge -->
    <path d="M 112 304 C 130 314 146 318 160 318 C 174 318 190 314 208 304 C 192 316 176 320 160 320 C 144 320 128 316 112 304 Z" fill="#9E6540" stroke="none" />

    <!-- Front grass tufts at the base -->

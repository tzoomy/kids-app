<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Cream Button Circle -->
    <circle cx="64" cy="64" r="56" fill="#FFFDF9"/>

    <!-- Soft Lower Inner Shadow Crescent -->
    <path d="M 12 78 A 56 56 0 0 0 116 78 C 104 104, 86 116, 64 116 C 42 116, 24 104, 12 78 Z" fill="#F0DEC2"/>

    <!-- Warm Upper Highlight Crescent -->
    <path d="M 24 42 C 34 22, 54 14, 78 16 C 58 18, 38 26, 24 42 Z" fill="#FFFFFF"/>
    <ellipse cx="36" cy="28" rx="8" ry="4" transform="rotate(-32 36 28)" fill="#FFFFFF"/>

    <!-- Outer 6px #3B2A22 Button Outline -->
    <circle cx="64" cy="64" r="56" fill="none" stroke="#3B2A22" stroke-width="6"/>

    <!-- Soft Warm Offset Shadow Behind X -->
    <path d="M 42 46 L 86 90 M 86 46 L 42 90" fill="none" stroke="#E5BE94" stroke-width="16"/>

    <!-- Big Bold Picture-Led X (Two Rounded-Cap Paths, No Text) -->
    <path d="M 42 42 L 86 86" fill="none" stroke="#3B2A22" stroke-width="14"/>
    <path d="M 86 42 L 42 86" fill="none" stroke="#3B2A22" stroke-width="14"/>

    <!-- Subtle Highlight Ticks on X Arms -->
    <path d="M 45 39 L 55 49" fill="none" stroke="#5C4338" stroke-width="4"/>
    <path d="M 83 39 L 73 49" fill="none" stroke="#5C4338" stroke-width="4"/>
  </g>
</svg>

    <path d="M252 156 C278 150 282 180 260 192 C248 198 236 188 238 172 Z" fill="#9B5DE5" stroke="#3B2A22" stroke-width="6"/>

    <!-- Round fuzzy monster body -->
    <path d="M150 56 C214 56 254 102 254 168 C254 232 214 268 150 268 C86 268 46 232 46 168 C46 102 86 56 150 56 Z" fill="#9B5DE5"/>

    <ellipse cx="214" cy="152" rx="16" ry="10" fill="#FF8FA3" opacity="0.75"/>

    <!-- Simple dot eyes -->
    <circle cx="114" cy="122" r="12" fill="#3B2A22"/>
    <circle cx="186" cy="122" r="12" fill="#3B2A22"/>
    <circle cx="110" cy="117" r="4" fill="#FFFDF9"/>
    <circle cx="182" cy="117" r="4" fill="#FFFDF9"/>


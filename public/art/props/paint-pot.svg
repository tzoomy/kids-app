<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Soft ground contact shadow -->
    <ellipse cx="100" cy="176" rx="58" ry="10" fill="#8C5230" opacity="0.2"/>

    <!-- Light neutral ceramic pot body -->
    <path d="M38 64 C35 106 38 140 52 166 C64 178 136 178 148 166 C162 140 165 106 162 64 Z" fill="#F3E9D8"/>
    <!-- Left body highlight -->
    <path d="M44 74 C42 108 45 138 56 159 C62 165 72 168 82 170 C72 142 68 108 70 76 Z" fill="#FFFBF2"/>
    <!-- Right and lower body warm shadow -->
    <path d="M134 74 C136 112 130 144 114 166 C98 172 78 172 60 166 C74 175 126 175 144 164 C156 140 159 108 156 74 Z" fill="#E2D4BE"/>
    <!-- Subtle decorative neutral band near base -->
    <path d="M46 146 C76 156 124 156 154 146" fill="none" stroke="#D3C2A8" stroke-width="5"/>
    <!-- Pot body outer outline -->
    <path d="M38 64 C35 106 38 140 52 166 C64 178 136 178 148 166 C162 140 165 106 162 64 Z" fill="none" stroke="#3B2A22" stroke-width="6"/>

    <!-- Top rounded ceramic rim -->
    <ellipse cx="100" cy="58" rx="66" ry="22" fill="#FFFBF2" stroke="#3B2A22" stroke-width="6"/>

    <!-- Inner pot opening wall -->
    <ellipse cx="100" cy="58" rx="54" ry="15" fill="#D3C2A8" stroke="#3B2A22" stroke-width="4"/>

    <!-- Pure white paint area (game draws the real color over this) -->
    <ellipse id="paint" cx="100" cy="61" rx="50" ry="11" fill="#FFFFFF"/>

    <!-- Subtle rim gloss highlight -->
    <path d="M48 48 C62 41 82 38 100 38" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400">
  <g id="flower-basket-back" stroke-linecap="round" stroke-linejoin="round">
    <!-- Soft ground contact shadow -->
    <ellipse cx="260" cy="366" rx="196" ry="22" fill="#8C5230" opacity="0.25"/>

    <!-- Arched wicker handle behind the basket opening -->
    <g>
      <!-- Outer handle arch band -->
      <path d="M92 204 C88 86 158 24 260 24 C362 24 432 86 428 204 L402 204 C404 102 346 48 260 48 C174 48 116 102 118 204 Z" fill="#B87D56" stroke="#3B2A22" stroke-width="6"/>

      <g fill="#E8AA6B">
        <rect x="104" y="252" width="34" height="10" rx="5" transform="rotate(6 121 257)"/>
        <rect x="172" y="260" width="38" height="10" rx="5" transform="rotate(3 191 265)"/>
        <rect x="242" y="264" width="36" height="10" rx="5"/>
        <rect x="310" y="260" width="38" height="10" rx="5" transform="rotate(-3 329 265)"/>
        <rect x="116" y="288" width="34" height="10" rx="5" transform="rotate(6 133 293)"/>
        <rect x="180" y="296" width="36" height="10" rx="5" transform="rotate(3 198 301)"/>
        <rect x="244" y="298" width="32" height="10" rx="5"/>
        <rect x="304" y="296" width="36" height="10" rx="5" transform="rotate(-3 322 301)"/>
      </g>

      <!-- Vertical wicker rib lines -->
      <g stroke="#3B2A22" stroke-width="5">
        <line x1="146" y1="236" x2="162" y2="344"/>
        <line x1="204" y1="244" x2="212" y2="350"/>
        <line x1="260" y1="246" x2="260" y2="352"/>
        <line x1="316" y1="244" x2="308" y2="350"/>
        <line x1="374" y1="236" x2="358" y2="344"/>
      </g>


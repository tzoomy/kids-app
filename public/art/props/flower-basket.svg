      <path d="M106 340 C156 356 364 356 414 340 C418 348 412 358 398 362 C352 374 168 374 122 362 C108 358 102 348 106 340 Z" fill="#9E6540" stroke="#3B2A22" stroke-width="6"/>
      <path d="M120 346 C168 358 352 358 400 346" fill="none" stroke="#DE9E5B" stroke-width="5"/>
      <g stroke="#3B2A22" stroke-width="4">
        <line x1="162" y1="348" x2="154" y2="366"/>
        <line x1="212" y1="352" x2="206" y2="370"/>
        <line x1="260" y1="354" x2="260" y2="371"/>
        <line x1="308" y1="352" x2="314" y2="370"/>
        <line x1="358" y1="348" x2="366" y2="366"/>

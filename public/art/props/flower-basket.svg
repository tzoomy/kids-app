      <path d="M102 176 C106 88 168 32 260 32 C352 32 414 88 418 176 C410 100 348 42 260 42 C172 42 110 100 102 176 Z" fill="#DE9E5B"/>
      <!-- Handle inner underside shadow -->
      <path d="M118 196 C120 104 176 52 260 52 C344 52 400 104 402 196 L394 196 C392 112 340 60 260 60 C180 60 128 112 126 196 Z" fill="#8C5230"/>
      <!-- Wrapped wicker grip at top center of handle -->
      <rect x="208" y="16" width="104" height="38" rx="18" ry="18" fill="#C68642" stroke="#3B2A22" stroke-width="6"/>
      <path d="M220 24 L300 24 C304 24 306 28 304 32 L216 32 C214 28 216 24 220 24 Z" fill="#E8AA6B"/>
      <line x1="234" y1="18" x2="234" y2="52" stroke="#3B2A22" stroke-width="5"/>
      <line x1="260" y1="18" x2="260" y2="52" stroke="#3B2A22" stroke-width="5"/>
      <line x1="286" y1="18" x2="286" y2="52" stroke="#3B2A22" stroke-width="5"/>
    </g>

    <!-- Back braided wicker rim (behind the flower) -->
    <g>
      <path d="M52 206 C52 154 142 134 260 134 C378 134 468 154 468 206 C446 216 372 184 260 184 C148 184 74 216 52 206 Z" fill="#B87D56" stroke="#3B2A22" stroke-width="6"/>
      <!-- Back rim upper highlight -->
      <path d="M66 192 C78 156 154 142 260 142 C366 142 442 156 454 192 C432 166 358 152 260 152 C162 152 88 166 66 192 Z" fill="#DE9E5B"/>
      <!-- Back rim braid segment lines -->
      <g stroke="#3B2A22" stroke-width="4">
        <line x1="112" y1="154" x2="124" y2="178"/>
        <line x1="168" y1="142" x2="176" y2="168"/>
        <line x1="228" y1="136" x2="232" y2="164"/>
        <line x1="292" y1="136" x2="288" y2="164"/>
        <line x1="352" y1="142" x2="344" y2="168"/>
        <line x1="408" y1="154" x2="396" y2="178"/>
      </g>
    </g>

    <!-- Basket interior cavity lined with cream and soft sage garden cloth -->
    <g>
      <!-- Deep interior cloth bowl (extends down to y=296 so flower stems sit inside cleanly) -->
      <path d="M64 206 C76 172 154 156 260 156 C366 156 444 172 456 206 C452 264 374 298 260 298 C146 298 68 264 64 206 Z" fill="#FFF6E0" stroke="#3B2A22" stroke-width="6"/>
      <!-- Top inner shadow just under the back rim for bowl depth -->
      <path d="M72 204 C86 174 158 162 260 162 C362 162 434 174 448 204 C428 184 356 176 260 176 C164 176 92 184 72 204 Z" fill="#E5D2AD"/>
      <!-- Soft sage green woven stripe inside the cloth liner -->
      <path d="M76 212 C104 188 172 178 260 178 C348 178 416 188 444 212 L438 226 C408 202 344 192 260 192 C176 192 112 202 82 226 Z" fill="#9BC184"/>
      <!-- Lower interior recessed shadow where flower stems rest -->
      <path d="M92 232 C136 218 384 218 428 232 C416 272 352 292 260 292 C168 292 104 272 92 232 Z" fill="#EFE0BE"/>
      <!-- Gentle fabric gather lines in the lining -->
      <g stroke="#D5C09A" stroke-width="4">
        <path d="M148 174 C154 198 164 222 176 242" fill="none"/>
        <path d="M260 168 L260 246" fill="none"/>
        <path d="M372 174 C366 198 356 222 344 242" fill="none"/>
      </g>
      <!-- Re-stroke interior cavity contour cleanly -->
      <path d="M64 206 C76 172 154 156 260 156 C366 156 444 172 456 206 C452 264 374 298 260 298 C146 298 68 264 64 206 Z" fill="none" stroke="#3B2A22" stroke-width="6"/>
    </g>
  </g>

  <g id="flower-basket-front" stroke-linecap="round" stroke-linejoin="round">

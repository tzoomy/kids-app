    <!-- Scalloped cream & soft sage cloth liner overhanging the front rim -->
    <g>
      <path d="M78 216 C142 240 378 240 442 216 L434 252 C406 266 374 262 348 248 C318 268 290 272 260 256 C230 272 202 268 172 248 C146 262 114 266 86 252 Z" fill="#FFF6E0" stroke="#3B2A22" stroke-width="6"/>
      <!-- Soft sage green decorative trim band along the front cloth drape -->
      <path d="M84 236 C112 248 144 246 172 232 C202 252 230 256 260 240 C290 256 318 252 348 232 C376 246 408 248 436 236 L434 248 C406 260 374 256 348 242 C318 262 290 266 260 250 C230 266 202 262 172 242 C146 256 114 260 86 248 Z" fill="#9BC184"/>
      <!-- Re-stroke cloth overhang border -->

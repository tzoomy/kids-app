    </g>

    <!-- Chunky braided front wicker rim lip (overlaps flower stems) -->
    <g>
      <path d="M46 198 C56 192 72 200 84 204 C144 222 376 222 436 204 C448 200 464 192 474 198 C482 204 478 220 464 226 C394 252 126 252 56 226 C42 220 38 204 46 198 Z" fill="#C68642" stroke="#3B2A22" stroke-width="6"/>
      <!-- Front rim lip upper highlight -->
      <path d="M60 202 C136 230 384 230 460 202 C446 214 380 236 260 236 C140 236 74 214 60 202 Z" fill="#E8AA6B"/>
      <!-- Front rim lip lower shadow -->
      <path d="M58 220 C134 244 386 244 462 220 C448 228 382 246 260 246 C138 246 72 228 58 220 Z" fill="#9E6540"/>
      <!-- Braided rim twist lines -->
      <g stroke="#3B2A22" stroke-width="5">
        <line x1="94" y1="206" x2="108" y2="234"/>
        <line x1="148" y1="214" x2="162" y2="242"/>
        <line x1="204" y1="218" x2="216" y2="246"/>
        <line x1="260" y1="220" x2="260" y2="248"/>
        <line x1="316" y1="218" x2="304" y2="246"/>
        <line x1="372" y1="214" x2="358" y2="242"/>
        <line x1="426" y1="206" x2="412" y2="234"/>
      </g>
      <!-- Re-stroke front rim outer contour cleanly -->
      <path d="M46 198 C56 192 72 200 84 204 C144 222 376 222 436 204 C448 200 464 192 474 198 C482 204 478 220 464 226 C394 252 126 252 56 226 C42 220 38 204 46 198 Z" fill="none" stroke="#3B2A22" stroke-width="6"/>

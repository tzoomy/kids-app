      <!-- Horizontal woven wicker bands across the belly -->
      <path d="M74 268 C164 294 356 294 446 268" fill="none" stroke="#8C5230" stroke-width="10"/>
      <path d="M74 264 C164 290 356 290 446 264" fill="none" stroke="#3B2A22" stroke-width="5"/>
      <path d="M86 304 C172 328 348 328 434 304" fill="none" stroke="#8C5230" stroke-width="10"/>
      <path d="M86 300 C172 324 348 324 434 300" fill="none" stroke="#3B2A22" stroke-width="5"/>


    <path d="M 96 172 H 246 C 268 172 282 156 276 138 C 270 124 254 118 242 122 C 230 98 202 90 180 102 C 162 86 130 90 120 114 C 100 114 82 130 84 150 C 86 162 90 172 96 172 Z" fill="#FFFDF9" />
    <path d="M 102 166 H 242 C 256 166 266 158 266 148 C 242 156 146 158 102 166 Z" fill="#FFF6E8" stroke="none" />
  </g>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1280" width="800" height="1280" stroke-linecap="round" stroke-linejoin="round">
  <!-- Tall sky background -->
  <rect x="0" y="0" width="800" height="1280" fill="#B8E6FF"/>
  <path d="M0 0 H800 V360 Q600 400 400 370 Q200 340 0 385 Z" fill="#FFFDF9" fill-opacity="0.35"/>

  <!-- Soft clouds -->
  <g fill="#FFFDF9" stroke="#5C4338" stroke-width="5">
    <path d="M90 170 Q90 132 130 132 Q152 102 194 106 Q232 110 244 140 Q276 142 276 172 Q276 198 242 198 H120 Q90 198 90 170 Z"/>
    <path d="M470 260 Q470 226 508 226 Q528 198 568 202 Q604 206 616 234 Q648 236 648 264 Q648 288 614 288 H498 Q470 288 470 260 Z"/>
    <path d="M160 390 Q160 360 194 360 Q212 336 248 340 Q280 344 290 368 Q318 370 318 394 Q318 416 288 416 H186 Q160 416 160 390 Z"/>
  </g>
  <path d="M110 186 H252" stroke="#F0DEC2" stroke-width="8"/>
  <path d="M490 276 H624" stroke="#F0DEC2" stroke-width="8"/>

  <!-- Far rolling hills -->
  <path d="M-20 640 Q180 535 410 595 Q620 650 820 555 V800 H-20 Z" fill="#98D886" stroke="#3B2A22" stroke-width="6"/>
  <path d="M30 605 Q190 550 370 592" fill="none" stroke="#8AE07E" stroke-width="10"/>
  <path d="M520 612 Q670 565 785 572" fill="none" stroke="#8AE07E" stroke-width="10"/>

  <!-- Distant garden trees -->
  <g stroke="#3B2A22" stroke-width="6">
    <!-- Left tree -->
    <rect x="118" y="510" width="28" height="80" rx="8" fill="#7A4B2A"/>
    <path d="M66 516 Q56 472 96 460 Q114 425 154 432 Q190 438 196 474 Q220 490 202 518 Q188 536 132 536 Q76 536 66 516 Z" fill="#57C457"/>
    <path d="M92 468 Q126 442 166 454" fill="none" stroke="#8AE07E" stroke-width="8"/>

    <!-- Right tree -->
    <rect x="646" y="492" width="28" height="82" rx="8" fill="#7A4B2A"/>
    <path d="M592 500 Q582 456 622 444 Q640 410 680 416 Q716 422 722 458 Q746 474 728 504 Q714 520 658 520 Q602 520 592 500 Z" fill="#57C457"/>
    <path d="M620 452 Q654 426 694 438" fill="none" stroke="#8AE07E" stroke-width="8"/>
  </g>

  <!-- Midground meadow -->
  <path d="M-20 668 Q260 625 520 658 Q680 678 820 645 V1300 H-20 Z" fill="#57C457" stroke="#3B2A22" stroke-width="6"/>
  <path d="M-20 688 Q260 645 520 678 Q680 698 820 665" fill="none" stroke="#8AE07E" stroke-width="10"/>

  <!-- Wooden garden fence -->
  <g fill="#CC926B" stroke="#3B2A22" stroke-width="5">
    <rect x="30" y="618" width="740" height="14" rx="6" fill="#B87D56"/>
    <rect x="30" y="644" width="740" height="14" rx="6" fill="#B87D56"/>
    <rect x="64" y="600" width="22" height="72" rx="8"/>
    <rect x="194" y="600" width="22" height="72" rx="8"/>
    <rect x="324" y="600" width="22" height="72" rx="8"/>
    <rect x="454" y="600" width="22" height="72" rx="8"/>
    <rect x="584" y="600" width="22" height="72" rx="8"/>
    <rect x="714" y="600" width="22" height="72" rx="8"/>
  </g>

  <!-- Soft bushes behind the track -->
  <g stroke="#3B2A22" stroke-width="6" fill="#3CA33C">
    <path d="M24 780 Q24 742 62 742 Q86 718 124 728 Q158 735 162 780 Z"/>
    <path d="M360 780 Q360 746 395 746 Q418 726 450 734 Q480 742 484 780 Z"/>
    <path d="M640 780 Q640 740 678 740 Q705 716 742 728 Q776 736 780 780 Z"/>
  </g>

  <!-- Horizontal gravel / dirt railway bed in the lower half -->
  <rect x="-20" y="780" width="840" height="160" fill="#F0DEC2" stroke="#3B2A22" stroke-width="6"/>
  <rect x="-20" y="792" width="840" height="18" fill="#FFF6E8"/>
  <rect x="-20" y="914" width="840" height="24" fill="#E8AA6B"/>

  <!-- Wooden railway sleepers (ties) -->
  <g fill="#B87D56" stroke="#3B2A22" stroke-width="5">
    <rect x="28" y="818" width="44" height="84" rx="8"/>
    <rect x="128" y="818" width="44" height="84" rx="8"/>
    <rect x="228" y="818" width="44" height="84" rx="8"/>
    <rect x="328" y="818" width="44" height="84" rx="8"/>
    <rect x="428" y="818" width="44" height="84" rx="8"/>
    <rect x="528" y="818" width="44" height="84" rx="8"/>
    <rect x="628" y="818" width="44" height="84" rx="8"/>
    <rect x="728" y="818" width="44" height="84" rx="8"/>
  </g>

  <!-- Horizontal rails -->
  <rect x="-20" y="834" width="840" height="14" fill="#C08552" stroke="#3B2A22" stroke-width="5"/>
  <rect x="-20" y="874" width="840" height="16" fill="#C08552" stroke="#3B2A22" stroke-width="5"/>

  <!-- Foreground meadow below track -->
  <path d="M-20 940 H820 V1300 H-20 Z" fill="#3CA33C" stroke="#3B2A22" stroke-width="6"/>
  <path d="M-20 962 Q220 946 420 964 Q620 980 820 956 V1300 H-20 Z" fill="#57C457"/>

  <!-- Gentle winding garden path in foreground -->
  <path d="M-20 1130 Q240 1090 460 1125 Q660 1155 820 1115 V1205 Q660 1245 460 1215 Q240 1180 -20 1220 Z" fill="#F0DEC2" stroke="#3B2A22" stroke-width="6"/>

  <!-- Calm garden flowers -->
  <g stroke="#3B2A22" stroke-width="5" fill="#FFD166">
    <circle cx="140" cy="1035" r="11"/>
    <circle cx="420" cy="1052" r="11"/>
    <circle cx="670" cy="1028" r="11"/>
  </g>
</svg>

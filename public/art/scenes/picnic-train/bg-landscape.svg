    <rect x="60" y="424" width="1160" height="14" rx="6" fill="#B87D56"/>
    <rect x="90" y="380" width="22" height="72" rx="8"/>
    <rect x="230" y="380" width="22" height="72" rx="8"/>
    <rect x="370" y="380" width="22" height="72" rx="8"/>
    <rect x="510" y="380" width="22" height="72" rx="8"/>
    <rect x="650" y="380" width="22" height="72" rx="8"/>
    <rect x="790" y="380" width="22" height="72" rx="8"/>
    <rect x="930" y="380" width="22" height="72" rx="8"/>
    <rect x="1070" y="380" width="22" height="72" rx="8"/>
    <rect x="1180" y="380" width="22" height="72" rx="8"/>

  <path d="M-20 688 Q320 672 640 690 Q960 706 1300 684 V820 H-20 Z" fill="#57C457"/>

  <!-- Small calm garden tufts and flowers -->
  <g stroke="#3B2A22" stroke-width="5" fill="#FFD166">
    <circle cx="190" cy="735" r="11"/>
    <circle cx="485" cy="748" r="11"/>
    <circle cx="870" cy="732" r="11"/>
    <circle cx="1120" cy="750" r="11"/>
  </g>

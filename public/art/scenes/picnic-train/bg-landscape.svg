    <rect x="168" y="300" width="28" height="75" rx="8" fill="#7A4B2A"/>
    <path d="M115 305 Q105 262 145 250 Q162 215 202 222 Q238 228 245 264 Q268 280 252 308 Q238 325 182 325 Q125 325 115 305 Z" fill="#57C457"/>
    <path d="M142 256 Q175 230 215 242" fill="none" stroke="#8AE07E" stroke-width="8"/>

    <!-- Right tree -->
    <rect x="1056" y="282" width="28" height="80" rx="8" fill="#7A4B2A"/>
    <path d="M1002 290 Q992 248 1032 236 Q1052 200 1090 206 Q1128 212 1134 248 Q1158 265 1140 294 Q1125 310 1070 310 Q1012 310 1002 290 Z" fill="#57C457"/>
    <path d="M1030 242 Q1065 215 1105 228" fill="none" stroke="#8AE07E" stroke-width="8"/>
  </g>

  <!-- Midground meadow -->
  <path d="M-20 445 Q360 400 720 438 Q1020 468 1300 425 V820 H-20 Z" fill="#57C457" stroke="#3B2A22" stroke-width="6"/>
  <path d="M-20 465 Q360 420 720 458 Q1020 488 1300 445" fill="none" stroke="#8AE07E" stroke-width="10"/>


  <!-- Horizontal rails -->
  <rect x="-20" y="570" width="1320" height="14" fill="#C08552" stroke="#3B2A22" stroke-width="5"/>
  <rect x="-20" y="608" width="1320" height="16" fill="#C08552" stroke="#3B2A22" stroke-width="5"/>


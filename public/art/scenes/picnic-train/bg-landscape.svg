  <g fill="#B87D56" stroke="#3B2A22" stroke-width="5">
    <rect x="36" y="556" width="44" height="80" rx="8"/>
    <rect x="136" y="556" width="44" height="80" rx="8"/>
    <rect x="236" y="556" width="44" height="80" rx="8"/>
    <rect x="336" y="556" width="44" height="80" rx="8"/>
    <rect x="436" y="556" width="44" height="80" rx="8"/>
    <rect x="536" y="556" width="44" height="80" rx="8"/>
    <rect x="636" y="556" width="44" height="80" rx="8"/>
    <rect x="736" y="556" width="44" height="80" rx="8"/>
    <rect x="836" y="556" width="44" height="80" rx="8"/>
    <rect x="936" y="556" width="44" height="80" rx="8"/>
    <rect x="1036" y="556" width="44" height="80" rx="8"/>
    <rect x="1136" y="556" width="44" height="80" rx="8"/>
    <rect x="1226" y="556" width="44" height="80" rx="8"/>

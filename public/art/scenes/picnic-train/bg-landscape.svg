<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" stroke-linecap="round" stroke-linejoin="round">
  <!-- Sky background -->
  <rect x="0" y="0" width="1280" height="800" fill="#B8E6FF"/>
  <path d="M0 0 H1280 V220 Q960 260 640 230 Q320 200 0 240 Z" fill="#FFFDF9" fill-opacity="0.35"/>

  <!-- Soft clouds -->
  <g fill="#FFFDF9" stroke="#5C4338" stroke-width="5">
    <path d="M140 130 Q140 95 178 95 Q198 68 238 72 Q275 74 285 104 Q318 106 318 134 Q318 158 286 158 H168 Q140 158 140 130 Z"/>
    <path d="M820 110 Q820 80 855 80 Q875 54 915 58 Q950 62 962 90 Q992 92 992 118 Q992 142 960 142 H848 Q820 142 820 110 Z"/>
  </g>
  <path d="M158 146 H298" stroke="#F0DEC2" stroke-width="8"/>
  <path d="M838 130 H974" stroke="#F0DEC2" stroke-width="8"/>

  <!-- Far rolling hills -->
  <path d="M-20 430 Q220 310 520 380 Q840 445 1080 340 Q1200 295 1300 350 V560 H-20 Z" fill="#98D886" stroke="#3B2A22" stroke-width="6"/>
  <path d="M40 395 Q240 330 470 378" fill="none" stroke="#8AE07E" stroke-width="10"/>
  <path d="M880 385 Q1080 322 1250 348" fill="none" stroke="#8AE07E" stroke-width="10"/>

  <!-- Distant garden trees and bushes -->
  <g stroke="#3B2A22" stroke-width="6">

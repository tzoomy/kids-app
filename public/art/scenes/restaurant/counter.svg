<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 260" width="1280" height="260" preserveAspectRatio="none">
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Wood Counter Front Base (y=88..260) -->
    <rect x="0" y="88" width="1280" height="172" fill="#B87D56"/>
    <!-- Drop Shadow directly under Countertop Lip -->
    <rect x="0" y="96" width="1280" height="24" fill="#9E6540"/>

    <!-- Stretch-Friendly Recessed Wood Panels (3 wide panels aligned with the 3 plate zones) -->
    <g fill="#CC926B" stroke="#5C4338" stroke-width="5">
      <rect x="48" y="128" width="352" height="108" rx="14"/>
      <rect x="464" y="128" width="352" height="108" rx="14"/>
      <rect x="880" y="128" width="352" height="108" rx="14"/>
    </g>
    <!-- Inner Panel Highlights -->
    <g fill="none" stroke="#E5BE94" stroke-width="4" stroke-opacity="0.6">
      <line x1="68" y1="140" x2="380" y2="140"/>
      <line x1="484" y1="140" x2="796" y2="140"/>
      <line x1="900" y1="140" x2="1192" y2="140"/>
    </g>

    <!-- Bottom Baseboard Trim -->
    <rect x="0" y="246" width="1280" height="14" fill="#9E6540"/>
    <line x1="0" y1="246" x2="1280" y2="246" stroke="#5C4338" stroke-width="5"/>

    <!-- Light Cream Countertop Surface (y=6..84, where plates sit) -->
    <rect x="0" y="6" width="1280" height="78" fill="#FFF6E6"/>
    <!-- Subtle Back Edge Rim Shadow -->
    <rect x="0" y="6" width="1280" height="10" fill="#EAD7B8" fill-opacity="0.6"/>
    <!-- Countertop Surface Shine Lines -->
    <line x1="60" y1="24" x2="320" y2="24" stroke="#FFFDF9" stroke-width="6"/>
    <line x1="500" y1="24" x2="780" y2="24" stroke="#FFFDF9" stroke-width="6"/>
    <line x1="960" y1="24" x2="1220" y2="24" stroke="#FFFDF9" stroke-width="6"/>

    <!-- Countertop Front Edge Lip (y=78..100) -->
    <rect x="0" y="78" width="1280" height="22" fill="#EAD7B8"/>
    <line x1="0" y1="78" x2="1280" y2="78" stroke="#5C4338" stroke-width="4"/>

    <!-- Main Counter Top & Lip Outlines -->
    <line x1="0" y1="6" x2="1280" y2="6" stroke="#3B2A22" stroke-width="6"/>
    <line x1="0" y1="100" x2="1280" y2="100" stroke="#3B2A22" stroke-width="6"/>
  </g>
</svg>

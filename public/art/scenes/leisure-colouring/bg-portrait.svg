<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1280" width="800" height="1280">
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Warm Wooden Desk Background (seen from above) -->
    <rect x="0" y="0" width="800" height="1280" fill="#E9C9A0"/>

    <!-- Subtle Horizontal Planks (8 planks, height 160 each) -->
    <rect x="0" y="0" width="800" height="160" fill="#E9C9A0"/>
    <rect x="0" y="160" width="800" height="160" fill="#E4BF94"/>
    <rect x="0" y="320" width="800" height="160" fill="#DDB68A"/>
    <rect x="0" y="480" width="800" height="160" fill="#E7C49A"/>
    <rect x="0" y="640" width="800" height="160" fill="#E1BA8E"/>
    <rect x="0" y="800" width="800" height="160" fill="#E9C9A0"/>
    <rect x="0" y="960" width="800" height="160" fill="#E4BF94"/>
    <rect x="0" y="1120" width="800" height="160" fill="#DDB68A"/>

    <!-- Plank Dividing Lines -->
    <line x1="0" y1="160" x2="800" y2="160" stroke="#CFA374" stroke-width="4"/>
    <line x1="0" y1="320" x2="800" y2="320" stroke="#CFA374" stroke-width="4"/>
    <line x1="0" y1="480" x2="800" y2="480" stroke="#CFA374" stroke-width="4"/>
    <line x1="0" y1="640" x2="800" y2="640" stroke="#CFA374" stroke-width="4"/>
    <line x1="0" y1="800" x2="800" y2="800" stroke="#CFA374" stroke-width="4"/>
    <line x1="0" y1="960" x2="800" y2="960" stroke="#CFA374" stroke-width="4"/>
    <line x1="0" y1="1120" x2="800" y2="1120" stroke="#CFA374" stroke-width="4"/>

    <!-- Staggered Plank Seams -->
    <line x1="520" y1="0" x2="520" y2="160" stroke="#CFA374" stroke-width="3"/>
    <line x1="260" y1="160" x2="260" y2="320" stroke="#CFA374" stroke-width="3"/>
    <line x1="610" y1="320" x2="610" y2="480" stroke="#CFA374" stroke-width="3"/>
    <line x1="180" y1="480" x2="180" y2="640" stroke="#CFA374" stroke-width="3"/>
    <line x1="560" y1="640" x2="560" y2="800" stroke="#CFA374" stroke-width="3"/>
    <line x1="320" y1="800" x2="320" y2="960" stroke="#CFA374" stroke-width="3"/>
    <line x1="640" y1="960" x2="640" y2="1120" stroke="#CFA374" stroke-width="3"/>
    <line x1="220" y1="1120" x2="220" y2="1280" stroke="#CFA374" stroke-width="3"/>

    <!-- Subtle Wood Grain Marks -->
    <path d="M 60 70 Q 120 62 170 72" fill="none" stroke="#CFA374" stroke-width="2.5"/>
    <path d="M 460 75 Q 520 82 580 72" fill="none" stroke="#CFA374" stroke-width="2.5"/>
    <path d="M 50 1020 Q 120 1010 180 1025" fill="none" stroke="#CFA374" stroke-width="2.5"/>
    <ellipse cx="690" cy="1195" rx="12" ry="6" fill="none" stroke="#CFA374" stroke-width="2"/>
    <path d="M 620 1200 Q 690 1210 760 1195" fill="none" stroke="#CFA374" stroke-width="2.5"/>

    <!-- CRAFT PROPS: side gutters beside the tool row, below the page (y 870-980; page ends y=808,
         tools sit at x 248-552, palette starts y>=1104). Each prop group has a stable deco-* id. -->
    <g id="deco-crayons"><g transform="translate(0 850)">
    <!-- Crayon 1: Coral Red (angled slightly down-right) -->
    <g>
      <path d="M 35 35 L 125 50 L 122 66 L 32 51 Z" fill="#F28B82" stroke="#3B2A22" stroke-width="4"/>
      <path d="M 50 38 L 110 48 L 107 64 L 47 54 Z" fill="#FFFDF9" stroke="#3B2A22" stroke-width="3.5"/>
      <polygon points="75,42 87,44 85,60 73,58" fill="#F28B82"/>
      <polygon points="125,50 146,54 122,66" fill="#F28B82" stroke="#3B2A22" stroke-width="4"/>
    </g>
    <!-- Crayon 2: Mint Green -->
    <g>
      <path d="M 45 78 L 135 93 L 132 109 L 42 94 Z" fill="#81C995" stroke="#3B2A22" stroke-width="4"/>
      <path d="M 60 81 L 120 91 L 117 107 L 57 97 Z" fill="#FFFDF9" stroke="#3B2A22" stroke-width="3.5"/>
      <polygon points="85,85 97,87 95,103 83,101" fill="#81C995"/>
      <polygon points="135,93 156,97 132,109" fill="#81C995" stroke="#3B2A22" stroke-width="4"/>
    </g>
    </g></g>
    <g id="deco-eraser"><g transform="translate(0 850)">
    <path d="M 600 40 L 632 35 L 637 60 L 605 65 Z" fill="#F8BBD0" stroke="#3B2A22" stroke-width="3.5"/>
    <path d="M 612 38 L 632 35 L 637 60 L 617 63 Z" fill="#FFFDF9" stroke="#3B2A22" stroke-width="3"/>
    <line x1="622" y1="37" x2="626" y2="61" stroke="#90CAF9" stroke-width="3"/>

    </g></g>
    <g id="deco-palette"><g transform="translate(0 850)">
    <path d="M 645 35 C 675 20 740 22 765 50 C 785 75 765 110 730 118 C 690 125 645 105 635 75 C 630 55 635 42 645 35 Z" fill="#F4D3A1" stroke="#3B2A22" stroke-width="4"/>
    <ellipse cx="660" cy="85" rx="8" ry="11" fill="#E4BF94" stroke="#3B2A22" stroke-width="3.5"/>
    <!-- Small Paint Dollops -->
    <circle cx="680" cy="42" r="9" fill="#F28B82" stroke="#3B2A22" stroke-width="3"/>
    <circle cx="678" cy="40" r="2.5" fill="#FFFDF9"/>
    <circle cx="710" cy="40" r="9" fill="#FDD663" stroke="#3B2A22" stroke-width="3"/>
    <circle cx="708" cy="38" r="2.5" fill="#FFFDF9"/>
    <circle cx="740" cy="55" r="9" fill="#81C995" stroke="#3B2A22" stroke-width="3"/>
    <circle cx="738" cy="53" r="2.5" fill="#FFFDF9"/>
    <circle cx="738" cy="88" r="9" fill="#90CAF9" stroke="#3B2A22" stroke-width="3"/>
    <circle cx="736" cy="86" r="2.5" fill="#FFFDF9"/>
    <circle cx="705" cy="100" r="8.5" fill="#CE93D8" stroke="#3B2A22" stroke-width="3"/>
    <circle cx="703" cy="98" r="2.5" fill="#FFFDF9"/>

    </g></g>
    <g id="deco-brush"><g transform="translate(0 850)">
    <path d="M 590 125 L 670 70 L 676 74 L 596 129 Z" fill="#CFA374" stroke="#3B2A22" stroke-width="3.5"/>
    <path d="M 670 70 L 676 74 L 684 68 L 678 64 Z" fill="#CFD8DC" stroke="#3B2A22" stroke-width="3"/>
    <path d="M 678 64 Q 694 52 696 58 Q 692 68 684 68 Z" fill="#90CAF9" stroke="#3B2A22" stroke-width="3"/>

    </g></g>

    <g id="deco-sparkle-1"><g transform="translate(0 850)"><path d="M 175 33 Q 175 40 182 40 Q 175 40 175 47 Q 175 40 168 40 Q 175 40 175 33 Z" fill="#FDD663"/></g></g>
    <g id="deco-sparkle-2"><g transform="translate(0 850)"><circle cx="30" cy="85" r="4.5" fill="#90CAF9"/></g></g>
    <g id="deco-sparkle-3"><g transform="translate(0 850)"><circle cx="165" cy="115" r="4" fill="#F8BBD0"/></g></g>
    <g id="deco-sparkle-4"><g transform="translate(0 850)"><path d="M 610 88 Q 610 95 617 95 Q 610 95 610 102 Q 610 95 603 95 Q 610 95 610 88 Z" fill="#FDD663"/></g></g>
    <g id="deco-sparkle-5"><g transform="translate(0 850)"><circle cx="765" cy="25" r="4" fill="#81C995"/></g></g>
    <g id="deco-sparkle-6"><g transform="translate(0 850)"><circle cx="645" cy="120" r="4.5" fill="#F8BBD0"/></g></g>
  </g>
</svg>

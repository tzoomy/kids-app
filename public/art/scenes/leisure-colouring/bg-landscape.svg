<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Warm Wooden Desk Background (seen from above) -->
    <rect x="0" y="0" width="1280" height="800" fill="#E9C9A0"/>

    <!-- Subtle Horizontal Planks -->
    <rect x="0" y="0" width="1280" height="160" fill="#E9C9A0"/>
    <rect x="0" y="160" width="1280" height="160" fill="#E4BF94"/>
    <rect x="0" y="320" width="1280" height="160" fill="#DDB68A"/>
    <rect x="0" y="480" width="1280" height="160" fill="#E7C49A"/>
    <rect x="0" y="640" width="1280" height="160" fill="#E1BA8E"/>

    <!-- Plank Dividing Lines -->
    <line x1="0" y1="160" x2="1280" y2="160" stroke="#CFA374" stroke-width="4"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke="#CFA374" stroke-width="4"/>
    <line x1="0" y1="480" x2="1280" y2="480" stroke="#CFA374" stroke-width="4"/>
    <line x1="0" y1="640" x2="1280" y2="640" stroke="#CFA374" stroke-width="4"/>

    <!-- Staggered Plank Seams -->
    <line x1="880" y1="0" x2="880" y2="160" stroke="#CFA374" stroke-width="3"/>
    <line x1="420" y1="160" x2="420" y2="320" stroke="#CFA374" stroke-width="3"/>
    <line x1="1060" y1="320" x2="1060" y2="480" stroke="#CFA374" stroke-width="3"/>
    <line x1="310" y1="480" x2="310" y2="640" stroke="#CFA374" stroke-width="3"/>
    <line x1="790" y1="640" x2="790" y2="800" stroke="#CFA374" stroke-width="3"/>

    <!-- Subtle Wood Grain Marks -->
    <path d="M 60 70 Q 110 65 170 72" fill="none" stroke="#CFA374" stroke-width="2.5"/>
    <path d="M 1120 95 Q 1180 88 1240 98" fill="none" stroke="#CFA374" stroke-width="2.5"/>
    <path d="M 1040 240 Q 1120 248 1210 236" fill="none" stroke="#CFA374" stroke-width="2.5"/>
    <ellipse cx="1160" cy="240" rx="12" ry="6" fill="none" stroke="#CFA374" stroke-width="2"/>
    <path d="M 70 410 Q 130 418 180 408" fill="none" stroke="#CFA374" stroke-width="2.5"/>
    <path d="M 1080 720 Q 1160 710 1230 724" fill="none" stroke="#CFA374" stroke-width="2.5"/>

    <!-- CRAFT PROPS: FAR-LEFT STRIP & CORNERS ONLY (x <= 200) -->

    <!-- Top-Left: Ceramic Pencil Cup with Tools -->
    <!-- Tool 1: Purple Marker / Ruler -->
    <path d="M 86 126 L 76 82 L 88 78 L 98 126 Z" fill="#CE93D8" stroke="#3B2A22" stroke-width="3.5"/>
    <!-- Tool 2: Sky Blue Pencil (angled left) -->
    <path d="M 82 128 L 52 48 L 64 44 L 94 126 Z" fill="#90CAF9" stroke="#3B2A22" stroke-width="4"/>
    <path d="M 52 48 L 64 44 L 58 28 Z" fill="#EED5B3" stroke="#3B2A22" stroke-width="4"/>
    <polygon points="56,34 60,32 58,28" fill="#90CAF9"/>
    <!-- Tool 3: Yellow Pencil (upright) -->
    <path d="M 102 126 L 102 40 L 118 40 L 118 126 Z" fill="#FDD663" stroke="#3B2A22" stroke-width="4"/>
    <path d="M 102 40 L 118 40 L 110 22 Z" fill="#EED5B3" stroke="#3B2A22" stroke-width="4"/>
    <polygon points="107,28 113,28 110,22" fill="#3B2A22"/>
    <!-- Tool 4: Paint Brush (angled right) -->
    <path d="M 124 128 L 152 56 L 160 60 L 132 130 Z" fill="#F4A261" stroke="#3B2A22" stroke-width="4"/>
    <path d="M 152 56 L 160 60 L 165 48 L 157 44 Z" fill="#CFD8DC" stroke="#3B2A22" stroke-width="3"/>
    <path d="M 157 44 Q 163 26 170 28 Q 175 42 165 48 Z" fill="#81C995" stroke="#3B2A22" stroke-width="3.5"/>
    <!-- Ceramic Cup Body -->
    <path d="M 68 130 L 74 204 Q 110 216 146 204 L 152 130 Z" fill="#FFF9F0" stroke="#3B2A22" stroke-width="4"/>
    <ellipse cx="110" cy="130" rx="42" ry="14" fill="#DDB68A" stroke="#3B2A22" stroke-width="4"/>
    <!-- Cute Heart Badge on Cup -->
    <path d="M 110 180 C 110 170 96 162 96 172 C 96 182 110 192 110 192 C 110 192 124 182 124 172 C 124 162 110 170 110 180 Z" fill="#F28B82" stroke="#3B2A22" stroke-width="3"/>

    <!-- Mid-Left: Two Loose Crayons -->
    <!-- Crayon 1: Coral Red -->
    <g>
      <path d="M 60 300 L 135 328 L 129 344 L 54 316 Z" fill="#F28B82" stroke="#3B2A22" stroke-width="4"/>
      <path d="M 72 305 L 122 323 L 117 337 L 67 319 Z" fill="#FFFDF9" stroke="#3B2A22" stroke-width="3.5"/>
      <polygon points="90,311 100,315 96,327 86,323" fill="#F28B82"/>
      <polygon points="135,328 154,335 129,344" fill="#F28B82" stroke="#3B2A22" stroke-width="4"/>
    </g>
    <!-- Crayon 2: Mint Teal -->
    <g>
      <path d="M 45 345 L 120 373 L 114 389 L 39 361 Z" fill="#80CBC4" stroke="#3B2A22" stroke-width="4"/>
      <path d="M 57 350 L 107 368 L 102 382 L 52 364 Z" fill="#FFFDF9" stroke="#3B2A22" stroke-width="3.5"/>
      <polygon points="75,356 85,360 81,372 71,368" fill="#80CBC4"/>
      <polygon points="120,373 139,380 114,389" fill="#80CBC4" stroke="#3B2A22" stroke-width="4"/>
    </g>

    <!-- Mid-Left: Soft Pink Eraser -->
    <path d="M 65 440 L 125 435 L 130 475 L 70 480 Z" fill="#F8BBD0" stroke="#3B2A22" stroke-width="4"/>
    <path d="M 85 438 L 125 435 L 130 475 L 90 478 Z" fill="#FFFDF9" stroke="#3B2A22" stroke-width="3.5"/>
    <!-- Star on Eraser Sleeve -->
    <polygon points="105,450 107,455 112,455 108,458 110,463 105,460 100,463 102,458 98,455 103,455" fill="#90CAF9"/>

    <!-- Bottom-Left: Cute Wooden Paint Palette -->
    <path d="M 55 585 C 95 550 170 560 195 615 C 215 660 190 725 140 745 C 95 760 45 725 40 670 C 35 630 35 605 55 585 Z" fill="#F4D3A1" stroke="#3B2A22" stroke-width="4"/>
    <ellipse cx="75" cy="690" rx="14" ry="18" fill="#E1BA8E" stroke="#3B2A22" stroke-width="4"/>
    <!-- Paint Blobs -->
    <circle cx="140" cy="595" r="13" fill="#F28B82" stroke="#3B2A22" stroke-width="3.5"/>
    <circle cx="137" cy="592" r="3.5" fill="#FFFDF9"/>
    <circle cx="175" cy="635" r="13" fill="#FDD663" stroke="#3B2A22" stroke-width="3.5"/>
    <circle cx="172" cy="632" r="3.5" fill="#FFFDF9"/>
    <circle cx="168" cy="680" r="13" fill="#81C995" stroke="#3B2A22" stroke-width="3.5"/>
    <circle cx="165" cy="677" r="3.5" fill="#FFFDF9"/>
    <circle cx="135" cy="720" r="13" fill="#90CAF9" stroke="#3B2A22" stroke-width="3.5"/>
    <circle cx="132" cy="717" r="3.5" fill="#FFFDF9"/>
    <circle cx="95" cy="735" r="12" fill="#CE93D8" stroke="#3B2A22" stroke-width="3.5"/>
    <circle cx="92" cy="732" r="3" fill="#FFFDF9"/>

    <!-- Paintbrush Resting on Palette -->
    <path d="M 45 765 L 140 600 L 148 605 L 53 770 Z" fill="#CFA374" stroke="#3B2A22" stroke-width="3.5"/>
    <path d="M 140 600 L 148 605 L 156 591 L 148 586 Z" fill="#CFD8DC" stroke="#3B2A22" stroke-width="3"/>
    <path d="M 148 586 Q 162 566 168 570 Q 166 585 156 591 Z" fill="#90CAF9" stroke="#3B2A22" stroke-width="3"/>

    <!-- Tiny Soft Sparkles / Confetti Dots (Far Left Margin Only, x < 200) -->
    <path d="M 185 98 Q 185 105 192 105 Q 185 105 185 112 Q 185 105 178 105 Q 185 105 185 98 Z" fill="#FDD663"/>
    <path d="M 40 252 Q 40 260 48 260 Q 40 260 40 268 Q 40 260 32 260 Q 40 260 40 252 Z" fill="#FDD663"/>
    <circle cx="180" cy="260" r="5" fill="#F8BBD0"/>
    <path d="M 185 408 Q 185 415 192 415 Q 185 415 185 422 Q 185 415 178 415 Q 185 415 185 408 Z" fill="#81C995"/>
    <circle cx="45" cy="530" r="4.5" fill="#90CAF9"/>
  </g>
</svg>

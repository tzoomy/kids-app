<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Language House game picker — production art preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #3B2A22;
      color: #3B2A22;
      font-family: "Noto Sans Hebrew", "Arial Hebrew", Tahoma, system-ui, sans-serif;
    }

    /* Full-viewport Language House picker backdrop (picker-bg). */
    .backdrop {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      display: block;
    }
    .scrim {
      position: absolute;
      inset: 0;
      background: rgba(59, 42, 34, 0.32);
    }

    .shell {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 32px;
    }

    .panel {
      position: relative;
      width: min(1180px, 100%);
      height: min(748px, 100%);
      background: rgba(255, 246, 232, 0.94);
      border: 6px solid #3B2A22;
      border-radius: 36px;
      box-shadow: 0 18px 0 rgba(59, 42, 34, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 28px 22px;
    }

    .header {
      position: relative;
      width: 100%;
      flex: 0 0 auto;
      min-height: 124px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .world-title {
      font-size: 32px;
      font-weight: 800;
      color: #3B2A22;
      line-height: 1.2;
      margin: 0 140px; /* keep title clear of the 120px top-left close button */
      text-align: center;
    }

    /* Picture-led close button displayed at 120px top-left (RTL-friendly). */
    .close {
      position: absolute;
      top: 2px;
      left: 4px;
      width: 120px;
      height: 120px;
      min-width: 120px;
      min-height: 120px;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 6px 0 rgba(59, 42, 34, 0.16));
    }
    .close img {
      width: 120px;
      height: 120px;
      display: block;
    }
    .close:focus-visible { outline: 4px solid #E5BE94; outline-offset: 4px; border-radius: 50%; }

    .picker {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: row;
      align-items: stretch;
      justify-content: center;
      gap: 32px;
      min-height: 0;
    }

    .game-card {
      appearance: none;
      -webkit-appearance: none;
      border: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      color: inherit;
    }
    .game-card:focus-visible { outline: 4px solid #C9842A; outline-offset: 6px; border-radius: 28px; }

    .card-frame {
      position: relative;
      height: 100%;
      max-width: 100%;
      aspect-ratio: 640 / 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      filter: drop-shadow(0 10px 0 rgba(59, 42, 34, 0.16));
    }

    .card-art {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    .card-label {
      position: absolute;
      bottom: 24px;
      left: 32px;
      right: 32px;
      background: #FFF6E8;
      border: 5px solid #3B2A22;
      border-radius: 20px;
      padding: 10px 16px 12px;
      font-size: 26px;
      font-weight: 800;
      line-height: 1.2;
      color: #3B2A22;
      text-align: center;
      box-shadow: 0 5px 0 rgba(59, 42, 34, 0.16);
    }

    @media (orientation: portrait) {
      .shell { padding: 18px 16px; }
      .panel {
        height: 100%;
        padding: 20px 18px 20px;
      }
      .world-title { font-size: 28px; margin: 0 132px; }
      .header { min-height: 122px; margin-bottom: 6px; }
      .close { top: 0; left: 0; }
      .picker {
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .game-card {
        width: 100%;
        height: 0;
      }
      .card-label {
        bottom: 20px;
        left: 28px;
        right: 28px;
        font-size: 24px;
        padding: 8px 14px 10px;
      }
    }
  </style>
</head>
<body>
  <img class="backdrop" src="../../public/art/ui/picker/bg.svg" alt="" />
  <div class="scrim"></div>
  <div class="shell">
    <div class="panel" role="dialog" aria-labelledby="world-title">
      <div class="header">
        <button type="button" class="close" data-testid="game-picker-close" aria-label="Close">
          <img src="../../public/art/ui/picker/close.svg" alt="" />
        </button>
        <h1 id="world-title" class="world-title">בית השפות</h1>
      </div>
      <div class="picker">
        <button type="button" class="game-card" data-testid="game-picker-animal-restaurant" aria-label="מסעדת החיות">
          <div class="card-frame">
            <img class="card-art" src="../../public/art/ui/picker/card-animal-restaurant.svg" alt="" />
            <span class="card-label">מסעדת החיות</span>
          </div>
        </button>
        <button type="button" class="game-card" data-testid="game-picker-kitchen-orchestra" aria-label="תזמורת המטבח">
          <div class="card-frame">
            <img class="card-art" src="../../public/art/ui/picker/card-kitchen-orchestra.svg" alt="" />
            <span class="card-label">תזמורת המטבח</span>
          </div>
        </button>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('load', () => {
      const imgs = Array.from(document.querySelectorAll('img'));
      Promise.all(imgs.map((img) => (img.complete ? Promise.resolve() : img.decode().catch(() => {})))).then(() => {
        window.__PREVIEW_READY__ = true;
      });
    });
  </script>
</body>
</html>
